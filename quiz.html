<!doctype html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:400,700" rel="stylesheet">
<link href='style.css' rel='stylesheet' type='text/css'>
<title>Sol Values Quiz</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<script type="application/javascript"
        src="questions.js">
</script>
<h1>Sol Values</h1>
<hr>
<h2 style="text-align:center;" id="question-number">Loading...</h2>
<p class="question">
    <span class="question-id" id="question-id"></span>
    <span id="question-text"></span>
</p>
<button class="button stronglyAgree" data-answer-button>Strongly Agree</button> <br>
<button class="button agree" data-answer-button>Agree</button> <br>
<button class="button neutral" data-answer-button>Neutral/Unsure</button> <br>
<button class="button disagree" data-answer-button>Disagree</button> <br>
<button class="button stronglyDisagree" data-answer-button>Strongly Disagree</button> <br>
<button class="small_button" onclick="prev_question()" id="back_button">Back</button>
<button class="small_button_off" id="back_button_off" disabled>Back</button><br>

<!-- JavaScript for the test itself -->
<script>
    var max_econ, max_dipl, max_govt, max_ordr, max_synd; // Max possible scores
    max_econ = max_dipl = max_govt = max_ordr = max_synd = 0;
    let econ_array = new Array(questions.length);
    let dipl_array = new Array(questions.length);
    let govt_array = new Array(questions.length);
    let synd_array = new Array(questions.length);
    let ordr_array = new Array(questions.length);
    const answerButtons = Array.from(document.querySelectorAll("[data-answer-button]"));
    const standardAnswers = [
        { label: "Strongly Agree", multiplier: 1.0, style: "stronglyAgree" },
        { label: "Agree", multiplier: 0.5, style: "agree" },
        { label: "Neutral/Unsure", multiplier: 0.0, style: "neutral" },
        { label: "Disagree", multiplier: -0.5, style: "disagree" },
        { label: "Strongly Disagree", multiplier: -1.0, style: "stronglyDisagree" }
    ];
    const enforcedAnswerPositive = [
        { label: "Strongly Agree", multiplier: 1.0, style: "stronglyAgree" },
        { label: "Strongly Agree", multiplier: 1.0, style: "stronglyAgree" },
        { label: "Agree", multiplier: 0.5, style: "agree" },
        { label: "Agree", multiplier: 0.5, style: "agree" },
        { label: "Unsure", multiplier: 0.0, style: "neutral" }
    ];
    const answerOverrides = {
        "20": [
            { label: "Strongly Agree", multiplier: 1.0, style: "stronglyAgree" },
            { label: "Strongly Agree", multiplier: 1.0, style: "stronglyAgree" },
            { label: "Strongly Agree", multiplier: 1.0, style: "stronglyAgree" },
            { label: "Strongly Agree", multiplier: 1.0, style: "stronglyAgree" },
            { label: "Agree", multiplier: 0.5, style: "agree" }
        ],
        "57": enforcedAnswerPositive,
        "58": enforcedAnswerPositive
    };
    var qn = 0; // Question number
    init_question();
    for (var i = 0; i < questions.length; i++) {
        max_econ += Math.abs(questions[i].effect.econ)
        max_dipl += Math.abs(questions[i].effect.dipl)
        max_govt += Math.abs(questions[i].effect.govt)
        max_synd += Math.abs(questions[i].effect.synd)
        max_ordr += Math.abs(questions[i].effect.ordr)
    }
    function init_question() {
        document.getElementById("question-text").textContent = questions[qn].question;
        document.getElementById("question-id").textContent = "#" + questions[qn].id;
        document.getElementById("question-number").textContent = "Question " + (qn + 1) + " of " + (questions.length);
        const answers = answerOverrides[String(questions[qn].id)] || standardAnswers;
        answerButtons.forEach((button, index) => {
            const answer = answers[index];
            button.textContent = answer.label;
            button.className = "button " + answer.style;
            button.onclick = () => next_question(answer.multiplier);
        });
        if (qn == 0) {
            document.getElementById("back_button").style.display = 'none';
            document.getElementById("back_button_off").style.display = 'block';
        } else {
            document.getElementById("back_button").style.display = 'block';
            document.getElementById("back_button_off").style.display = 'none';
        }

    }

    function next_question(mult) {
        econ_array[qn] = mult*questions[qn].effect.econ
        dipl_array[qn] = mult*questions[qn].effect.dipl
        govt_array[qn] = mult*questions[qn].effect.govt
        synd_array[qn] = mult*questions[qn].effect.synd
        ordr_array[qn] = mult*questions[qn].effect.ordr
        qn++;
        if (qn < questions.length) {
            init_question();
        } else {
            results();
        }
    }

    function prev_question() {
        if (qn == 0) {
            return;
        }
        qn--;
        init_question();
    }

    function calc_score(score,max) {
        if (max === 0) {
            return "50.0"
        }
        return (100*(max+score)/(2*max)).toFixed(1)
    }

    function results() {
        let final_econ = econ_array.reduce((a, b) => a + b, 0)
        let final_dipl = dipl_array.reduce((a, b) => a + b, 0)
        let final_govt = govt_array.reduce((a, b) => a + b, 0)
        let final_synd = synd_array.reduce((a, b) => a + b, 0)
        let final_ordr = ordr_array.reduce((a, b) => a + b, 0)
        location.href = `results.html`
            + `?e=${calc_score(final_econ,max_econ)}`
            + `&d=${calc_score(final_dipl,max_dipl)}`
            + `&g=${calc_score(final_govt,max_govt)}`
            + `&y=${calc_score(final_synd,max_synd)}`
            + `&o=${calc_score(final_ordr,max_ordr)}`
    }
</script>
</body>
</html>

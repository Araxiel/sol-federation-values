<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sol Values Results</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:400,700" rel="stylesheet">
    <link href="style.css" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body class="results-page">
<main>
    <h1>Sol Values</h1>
    <hr>
    <h2 class="results-title">Your Results</h2>
    <p class="results-intro">Each bar shows your position between the two ends of an axis.</p>

    <div id="results-axes" aria-live="polite"></div>

    <section class="closest-match" aria-labelledby="closest-match-heading">
        <h2 id="closest-match-heading">Closest Match</h2>
        <p id="ideology-label">Calculating…</p>
        <p class="results-note">Ideological matching is an experimental, placeholder feature.</p>
    </section>

    <section class="result-export" aria-labelledby="result-export-heading">
        <h2 id="result-export-heading">Shareable Result</h2>
        <img id="banner" alt="A shareable image of these Sol Values results">
        <button class="button" id="download-result" type="button" disabled>Download Results Image</button>
    </section>

    <div class="results-actions">
        <button class="button" type="button" onclick="location.href='quiz.html'">Retake Quiz</button>
        <button class="button secondary-button" type="button" onclick="location.href='index.html'">Back to Home</button>
    </div>
    <noscript><p class="results-error">JavaScript is required to display your results.</p></noscript>
</main>

<script src="ideologies.js"></script>
<script>
    const params = new URLSearchParams(window.location.search)

    function readScore(key) {
        const value = Number.parseFloat(params.get(key))
        return Number.isFinite(value) ? Math.min(100, Math.max(0, value)) : 50
    }

    const scores = {
        econ: readScore("e"),
        dipl: readScore("d"),
        govt: readScore("g"),
        synd: readScore("y"),
        ordr: readScore("o")
    }

    const axes = [
        {
            name: "Governance",
            left: "Federalism",
            right: "Autonomism",
            leftScore: scores.govt,
            leftColor: "--axis-federalism",
            rightColor: "--axis-autonomism",
            leftIcon: "value_images/federalism.svg",
            rightIcon: "value_images/autonomism.svg"
        },
        {
            name: "Political Economy",
            left: "Commonwealth",
            right: "Corporatism",
            leftScore: scores.econ,
            leftColor: "--axis-commonwealth",
            rightColor: "--axis-corporatism",
            leftIcon: "value_images/commonwealth.svg",
            rightIcon: "value_images/corporatism.svg"
        },
        {
            name: "Security",
            left: "Militarism",
            right: "Defencism",
            leftScore: scores.dipl,
            leftColor: "--axis-militarism",
            rightColor: "--axis-defencism",
            leftIcon: "value_images/militarism.svg",
            rightIcon: "value_images/defencism.svg"
        },
        {
            name: "Ownership",
            left: "Synthesism",
            right: "Capitalism",
            leftScore: scores.synd,
            leftColor: "--axis-synthesism",
            rightColor: "--axis-capitalism",
            leftIcon: "value_images/synthesism.svg",
            rightIcon: "value_images/capitalism.svg"
        },
        {
            name: "Civic Order",
            left: "Feudalism",
            right: "Universalism",
            leftScore: 100 - scores.ordr,
            leftColor: "--axis-feudalism",
            rightColor: "--axis-universalism",
            leftIcon: "value_images/feudalism.svg",
            rightIcon: "value_images/universalism.svg"
        }
    ]

    function formatScore(value) {
        return value.toFixed(1) + "%"
    }

    function describeAxis(axis) {
        const difference = Math.abs(axis.leftScore - 50)
        if (difference < 5) return "Balanced"

        const leadingValue = axis.leftScore > 50 ? axis.left : axis.right
        if (difference >= 35) return "Strongly " + leadingValue
        if (difference >= 20) return leadingValue
        return "Leaning " + leadingValue
    }

    function renderAxis(axis) {
        const rightScore = 100 - axis.leftScore
        const section = document.createElement("section")
        section.className = "result-axis"

        const heading = document.createElement("h2")
        heading.className = "result-axis-heading"
        heading.textContent = axis.name + ": " + describeAxis(axis)

        const layout = document.createElement("div")
        layout.className = "result-axis-layout"

        const leftIcon = document.createElement("img")
        leftIcon.className = "result-axis-icon"
        leftIcon.src = axis.leftIcon
        leftIcon.alt = axis.left

        const axisBody = document.createElement("div")
        axisBody.className = "result-axis-body"

        const labels = document.createElement("div")
        labels.className = "result-value-labels"

        const leftLabel = document.createElement("span")
        leftLabel.textContent = axis.left + " " + formatScore(axis.leftScore)

        const rightLabel = document.createElement("span")
        rightLabel.textContent = formatScore(rightScore) + " " + axis.right

        labels.append(leftLabel, rightLabel)

        const bar = document.createElement("div")
        bar.className = "result-bar"
        bar.setAttribute("role", "img")
        bar.setAttribute(
            "aria-label",
            axis.name + ": " + formatScore(axis.leftScore) + " " + axis.left
                + ", " + formatScore(rightScore) + " " + axis.right
        )

        const leftBar = document.createElement("div")
        leftBar.className = "result-bar-segment"
        leftBar.style.width = axis.leftScore + "%"
        leftBar.style.backgroundColor = `var(${axis.leftColor})`

        const rightBar = document.createElement("div")
        rightBar.className = "result-bar-segment"
        rightBar.style.width = rightScore + "%"
        rightBar.style.backgroundColor = `var(${axis.rightColor})`

        bar.append(leftBar, rightBar)
        axisBody.append(labels, bar)

        const rightIcon = document.createElement("img")
        rightIcon.className = "result-axis-icon"
        rightIcon.src = axis.rightIcon
        rightIcon.alt = axis.right

        layout.append(leftIcon, axisBody, rightIcon)
        section.append(heading, layout)
        return section
    }

    const axesContainer = document.getElementById("results-axes")
    axes.forEach(axis => axesContainer.appendChild(renderAxis(axis)))

    function findClosestIdeology() {
        if (!Array.isArray(ideologies) || ideologies.length === 0) {
            return "No placeholder match available"
        }

        let closest = ideologies[0]
        let closestDistance = Infinity

        for (const ideology of ideologies) {
            const stats = ideology.stats || {}
            const distance = Object.entries(scores).reduce((total, [key, score]) => {
                const ideologyScore = Number.isFinite(stats[key]) ? stats[key] : 50
                return total + Math.pow(ideologyScore - score, 2)
            }, 0)

            if (distance < closestDistance) {
                closest = ideology
                closestDistance = distance
            }
        }

        return closest.name
    }

    const closestIdeology = findClosestIdeology()
    document.getElementById("ideology-label").textContent = closestIdeology

    function loadImage(src) {
        return new Promise(resolve => {
            const image = new Image()
            image.onload = () => resolve(image)
            image.onerror = () => resolve(null)
            image.src = src
        })
    }

    function cssColor(variable) {
        return getComputedStyle(document.documentElement).getPropertyValue(variable).trim()
    }

    async function createShareableImage() {
        if (document.fonts && document.fonts.ready) await document.fonts.ready

        const canvas = document.createElement("canvas")
        const context = canvas.getContext("2d")
        canvas.width = 1000
        canvas.height = 790

        context.fillStyle = cssColor("--surface-bg")
        context.fillRect(0, 0, canvas.width, canvas.height)
        context.fillStyle = cssColor("--heading-text")
        context.font = "700 48px Montserrat, sans-serif"
        context.textAlign = "left"
        context.fillText("Sol Values", 35, 58)
        context.font = "300 25px Montserrat, sans-serif"
        context.fillText("Closest Match: " + closestIdeology, 35, 96)

        const iconPairs = await Promise.all(axes.map(async axis => [
            await loadImage(axis.leftIcon),
            await loadImage(axis.rightIcon)
        ]))

        axes.forEach((axis, index) => {
            const top = 120 + index * 128
            const barX = 145
            const barY = top + 54
            const barWidth = 710
            const barHeight = 46
            const rightScore = 100 - axis.leftScore

            context.fillStyle = cssColor("--heading-text")
            context.font = "700 23px Montserrat, sans-serif"
            context.textAlign = "center"
            context.fillText(axis.name + ": " + describeAxis(axis), 500, top + 24)

            context.font = "700 16px Montserrat, sans-serif"
            context.textAlign = "left"
            context.fillText(axis.left + " " + formatScore(axis.leftScore), barX, top + 48)
            context.textAlign = "right"
            context.fillText(formatScore(rightScore) + " " + axis.right, barX + barWidth, top + 48)

            context.fillStyle = cssColor(axis.leftColor)
            context.fillRect(barX, barY, barWidth * axis.leftScore / 100, barHeight)
            context.fillStyle = cssColor(axis.rightColor)
            context.fillRect(barX + barWidth * axis.leftScore / 100, barY, barWidth * rightScore / 100, barHeight)
            context.strokeStyle = cssColor("--page-bg")
            context.lineWidth = 4
            context.strokeRect(barX, barY, barWidth, barHeight)

            const [leftIcon, rightIcon] = iconPairs[index]
            if (leftIcon) context.drawImage(leftIcon, 35, top + 17, 92, 92)
            if (rightIcon) context.drawImage(rightIcon, 873, top + 17, 92, 92)
        })

        const banner = document.getElementById("banner")
        banner.src = canvas.toDataURL("image/png")

        const downloadButton = document.getElementById("download-result")
        downloadButton.disabled = false
        downloadButton.addEventListener("click", () => {
            const link = document.createElement("a")
            link.download = "sol-values-results.png"
            link.href = banner.src
            link.click()
        })
    }

    createShareableImage()
</script>
</body>
</html>

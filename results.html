<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sol Values Results</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:400,700" rel="stylesheet">
    <link href="style.css" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body class="results-page">
<main>
    <h1>Sol Values</h1>
    <hr>
    <h2 class="results-title">Your Results</h2>
    <p class="results-intro">Each bar shows your position between the two ends of an axis.</p>

    <div id="results-axes" aria-live="polite"></div>

    <section class="closest-match" aria-labelledby="closest-match-heading">
        <h2 id="closest-match-heading">Closest Match</h2>
        <p id="ideology-label">Calculating…</p>
        <p class="results-note">Ideological matching is an experimental, placeholder feature.</p>
    </section>

    <div class="results-actions">
        <button class="button" type="button" onclick="location.href='quiz.html'">Retake Quiz</button>
        <button class="button secondary-button" type="button" onclick="location.href='index.html'">Back to Home</button>
    </div>
    <noscript><p class="results-error">JavaScript is required to display your results.</p></noscript>
</main>

<script src="ideologies.js"></script>
<script>
    const params = new URLSearchParams(window.location.search)

    function readScore(key) {
        const value = Number.parseFloat(params.get(key))
        return Number.isFinite(value) ? Math.min(100, Math.max(0, value)) : 50
    }

    const scores = {
        econ: readScore("e"),
        dipl: readScore("d"),
        govt: readScore("g"),
        synd: readScore("y"),
        ordr: readScore("o")
    }

    const axes = [
        {
            name: "Governance",
            left: "Federalism",
            right: "Autonomism",
            leftScore: 100 - scores.govt,
            leftColor: "var(--axis-federalism)",
            rightColor: "var(--axis-autonomism)"
        },
        {
            name: "Political Economy",
            left: "Commonwealth",
            right: "Corporatism",
            leftScore: scores.econ,
            leftColor: "var(--axis-commonwealth)",
            rightColor: "var(--axis-corporatism)"
        },
        {
            name: "Security",
            left: "Militarism",
            right: "Defencism",
            leftScore: 100 - scores.dipl,
            leftColor: "var(--axis-militarism)",
            rightColor: "var(--axis-defencism)"
        },
        {
            name: "Ownership",
            left: "Synthesism",
            right: "Capitalism",
            leftScore: scores.synd,
            leftColor: "var(--axis-synthesism)",
            rightColor: "var(--axis-capitalism)"
        },
        {
            name: "Civic Order",
            left: "Feudalism",
            right: "Universalism",
            leftScore: 100 - scores.ordr,
            leftColor: "var(--axis-feudalism)",
            rightColor: "var(--axis-universalism)"
        }
    ]

    function formatScore(value) {
        return value.toFixed(1) + "%"
    }

    function describeAxis(axis) {
        const difference = Math.abs(axis.leftScore - 50)
        if (difference < 5) return "Balanced"

        const leadingValue = axis.leftScore > 50 ? axis.left : axis.right
        if (difference >= 35) return "Strongly " + leadingValue
        if (difference >= 20) return leadingValue
        return "Leaning " + leadingValue
    }

    function renderAxis(axis) {
        const rightScore = 100 - axis.leftScore
        const section = document.createElement("section")
        section.className = "result-axis"

        const heading = document.createElement("h2")
        heading.className = "result-axis-heading"
        heading.textContent = axis.name + ": " + describeAxis(axis)

        const labels = document.createElement("div")
        labels.className = "result-value-labels"

        const leftLabel = document.createElement("span")
        leftLabel.textContent = axis.left + " " + formatScore(axis.leftScore)

        const rightLabel = document.createElement("span")
        rightLabel.textContent = formatScore(rightScore) + " " + axis.right

        labels.append(leftLabel, rightLabel)

        const bar = document.createElement("div")
        bar.className = "result-bar"
        bar.setAttribute("role", "img")
        bar.setAttribute(
            "aria-label",
            axis.name + ": " + formatScore(axis.leftScore) + " " + axis.left
                + ", " + formatScore(rightScore) + " " + axis.right
        )

        const leftBar = document.createElement("div")
        leftBar.className = "result-bar-segment"
        leftBar.style.width = axis.leftScore + "%"
        leftBar.style.backgroundColor = axis.leftColor

        const rightBar = document.createElement("div")
        rightBar.className = "result-bar-segment"
        rightBar.style.width = rightScore + "%"
        rightBar.style.backgroundColor = axis.rightColor

        bar.append(leftBar, rightBar)
        section.append(heading, labels, bar)
        return section
    }

    const axesContainer = document.getElementById("results-axes")
    axes.forEach(axis => axesContainer.appendChild(renderAxis(axis)))

    function findClosestIdeology() {
        if (!Array.isArray(ideologies) || ideologies.length === 0) {
            return "No placeholder match available"
        }

        let closest = ideologies[0]
        let closestDistance = Infinity

        for (const ideology of ideologies) {
            const stats = ideology.stats || {}
            const distance = Object.entries(scores).reduce((total, [key, score]) => {
                const ideologyScore = Number.isFinite(stats[key]) ? stats[key] : 50
                return total + Math.pow(ideologyScore - score, 2)
            }, 0)

            if (distance < closestDistance) {
                closest = ideology
                closestDistance = distance
            }
        }

        return closest.name
    }

    document.getElementById("ideology-label").textContent = findClosestIdeology()
</script>
</body>
</html>
